name: 问题反馈 / Bug report
description: 该放没放、不该停放了、该停没停、崩溃
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        这个程序判断的是屏幕左上角那一块像素，所以**同样的画面才有同样的行为**。
        光描述"没放歌"定位不了，请尽量把下面几项填全；能附上诊断文件最好。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 命令行 `nightreign-rain-1.0.exe --version`，或 exe 右键 → 属性 → 详细信息里的文件版本
      placeholder: "1.0"
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: 症状
      options:
        - 该放的时候没放（队友都倒在最后一格）
        - 不该放的时候放了
        - 该停的时候没停（有人被救起来了还在放）
        - 不该停的时候停了（放一半断了）
        - 悬浮窗不见了 / 数错队友人数
        - 崩溃、闪退、界面无响应
        - 连不上游戏窗口 / 抓不到画面
        - 其他
    validations:
      required: true

  - type: dropdown
    id: display
    attributes:
      label: 游戏显示模式
      description: 独占全屏抓不到画面，这是设计如此，不是 bug
      options: [无边框窗口, 窗口化, 独占全屏, 不确定]
    validations:
      required: true

  - type: input
    id: geometry
    attributes:
      label: 屏幕分辨率 / 游戏内「界面尺寸」
      placeholder: "2560x1600，界面尺寸默认"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 什么时候触发、当时队友几个、几点几分左右（对诊断有用）
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 诊断文件
      description: |
        程序里勾上「记录诊断」再复现一次，把 exe 旁 `diagnostics\<时间戳>\` 整个目录打包传上来；
        崩溃类的问题请一并附上 `崩溃.log`。
        **贴之前先脱敏**：HUD 小图里能看到你和队友的游戏 ID。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: searched
    attributes:
      label: 确认过这些
      options:
        - label: 游戏不是独占全屏（是的话程序会提示，改无边框即可）
          required: true
        - label: `music\` 里有可播放的文件，且「开始监听」是开着的状态
          required: true
        - label: 已经看过 README 的「已知边界」一节
          required: false
