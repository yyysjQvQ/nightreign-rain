[pytest]
# backup/ holds a full v1 snapshot including its own tests/, which cannot import
# from a source tree that is not theirs; without this a bare `pytest` collects
# them and reports fifteen bogus collection errors.
testpaths = tests
norecursedirs = backup build dist .venv assets music
markers =
    needs_audio: 需要一个能出声的音频设备（CI 的 runner 没有，见 .github/workflows/tests.yml）
